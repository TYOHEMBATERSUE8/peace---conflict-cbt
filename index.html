<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peace and Conflict Resolution — CBT</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fa;color:#18212b}
.container{max-width:950px;margin:auto;padding:20px}
.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.08);margin:18px 0}
h1{margin-top:0}
.muted{color:#667085}
input[type=password]{width:100%;padding:13px;border:1px solid #cfd6df;border-radius:8px;font-size:16px}
button{border:0;border-radius:8px;padding:12px 18px;font-size:15px;cursor:pointer}
.primary{background:#1f5eff;color:#fff}
.secondary{background:#e9eef5;color:#18212b}
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:10;background:#fff;padding:12px 0;border-bottom:1px solid #e3e8ef}
.timer{font-size:22px;font-weight:700;text-align:center;padding:10px;border-radius:9px;background:#fff0f0;color:#b42318}
.progress{height:8px;background:#e5e7eb;border-radius:8px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:#1f5eff;width:0}
.question{border:1px solid #e0e5eb;border-radius:12px;padding:18px;margin:16px 0}
.question h3{margin-top:0;font-size:17px}
.option{display:block;padding:10px 12px;margin:7px 0;border:1px solid #e1e6ec;border-radius:8px;cursor:pointer}
.option:hover{background:#f7f9fc}
.option input{margin-right:9px}
.result{font-size:22px;font-weight:700}
.correct{background:#eaf7ee;border-color:#72c08a}
.incorrect{background:#fff0f0;border-color:#e48b8b}
.small{font-size:13px}
</style>
</head>
<body>
<div class="container">

<div id="login" class="card">
  <h1>Peace and Conflict Resolution CBT</h1>
  <p class="muted">100 objective questions • 50 minutes</p>
  <label for="password"><strong>Enter password</strong></label>
  <input id="password" type="password" autocomplete="off" placeholder="Password">
  <p id="loginError" class="small" style="color:#b42318"></p>
  <button class="primary" onclick="startTest()">Access Test</button>
</div>

<div id="test" class="hidden">
  <div class="topbar">
    <div class="timer" id="timer">50:00</div>
    <div class="progress"><div id="progressBar"></div></div>
    <div class="small muted" id="progressText">0 of 100 answered</div>
  </div>
  <div class="card">
    <h1>Peace and Conflict Resolution</h1>
    <p class="muted">Choose the correct option from A–D. The test will submit automatically when time expires.</p>
    <form id="quizForm"></form>
    <button type="button" class="primary" onclick="submitTest(false)">Submit Test</button>
  </div>
</div>

<div id="results" class="hidden">
  <div class="card">
    <h1>Test Result</h1>
    <div class="result" id="score"></div>
    <p id="summary"></p>
    <button class="secondary" onclick="showAnswers()">Show Correct Answers</button>
  </div>
  <div id="answerReview" class="card hidden"></div>
</div>

</div>

const PASSWORD = "SIR TERSUE";
let remaining = 50 * 60;
let timerHandle = null;
let submitted = false;

function startTest() {
  const p = document.getElementById("password").value;
  if (p !== PASSWORD) {
    document.getElementById("loginError").textContent = "Incorrect password. Enter exactly: SIR TERSUE";
    return;
  }
  document.getElementById("login").classList.add("hidden");
  document.getElementById("test").classList.remove("hidden");
  renderQuiz();
  updateTimer();
  timerHandle = setInterval(() => {
    remaining--;
    updateTimer();
    if (remaining <= 0) {
      clearInterval(timerHandle);
      submitTest(true);
    }
  }, 1000);
}

function renderQuiz() {
  const form = document.getElementById("quizForm");
  form.innerHTML = QUESTIONS.map(item => `
    <div class="question" id="question-${item.number}">
      <h3>${item.number}. ${escapeHtml(item.q)}</h3>
      ${["A","B","C","D"].map(letter => `
        <label class="option">
          <input type="radio" name="q${item.number}" value="${letter}" onchange="updateProgress()">
          <strong>${letter}.</strong> ${escapeHtml(item.options[letter])}
        </label>`).join("")}
    </div>`).join("");
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function updateTimer() {
  const mins = Math.floor(Math.max(remaining,0)/60);
  const secs = Math.max(remaining,0)%60;
  document.getElementById("timer").textContent =
    String(mins).padStart(2,"0") + ":" + String(secs).padStart(2,"0");
}

function updateProgress() {
  const answered = QUESTIONS.filter(q => document.querySelector(`input[name="q${q.number}"]:checked`)).length;
  document.getElementById("progressText").textContent = `${answered} of 100 answered`;
  document.getElementById("progressBar").style.width = `${answered}%`;
}

function submitTest(autoSubmit) {
  if (submitted) return;
  submitted = true;
  clearInterval(timerHandle);

  let score = 0;
  QUESTIONS.forEach(item => {
    const selected = document.querySelector(`input[name="q${item.number}"]:checked`);
    if (selected && selected.value === item.answer) score++;
  });

  document.getElementById("test").classList.add("hidden");
  document.getElementById("results").classList.remove("hidden");
  document.getElementById("score").textContent = `Score: ${score} / 100`;
  document.getElementById("summary").textContent =
    autoSubmit ? "Time expired. Your test was submitted automatically." :
    `You answered ${QUESTIONS.filter(q => document.querySelector(`input[name="q${q.number}"]:checked`)).length} of 100 questions.`;
}

function showAnswers() {
  const box = document.getElementById("answerReview");
  box.classList.remove("hidden");
  box.innerHTML = "<h2>Correct Answers</h2>" + QUESTIONS.map(item => {
    const selected = document.querySelector(`input[name="q${item.number}"]:checked`);
    const chosen = selected ? selected.value : "Not answered";
    const cls = chosen === item.answer ? "correct" : "incorrect";
    return `<div class="question ${cls}">
      <strong>${item.number}.</strong> Correct answer: <strong>${item.answer}</strong>
      <span class="small"> — Your answer: ${chosen}</span>
    </div>`;
  }).join("");
}
</script>
</body>
</html>
